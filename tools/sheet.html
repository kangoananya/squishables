<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>squishables contact sheet</title>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; background: #15171a; color: #ddd; font: 13px system-ui, sans-serif; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); }
    .cell { position: relative; aspect-ratio: 1; }
    .cell span { position: absolute; left: 8px; top: 6px; z-index: 2; background: #15171acc; padding: 1px 4px; }
    #grid { position: relative; z-index: 1; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script type="module">
    // Dev tool: renders every candidate recipe in one page (one screenshot).
    // ?set=presets shows the shipped graph presets instead of tools/candidates.js
    import * as THREE from 'three';
    import { runGraph } from '../src/kernel/graph.js';
    import { toRenderBuffers } from '../src/kernel/export.js';
    import { toCompiled, GRAPH_PRESETS } from '../src/graph-presets.js';
    import { CANDIDATES } from './candidates.js';

    const list = new URLSearchParams(location.search).get('set') === 'presets' ? GRAPH_PRESETS : CANDIDATES;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.setScissorTest(true);
    document.body.append(renderer.domElement);
    renderer.setClearColor(0x1b1d21);
    renderer.clear();

    const material = new THREE.MeshStandardMaterial({ color: 0xe0dbd0, roughness: 0.85, flatShading: true, side: THREE.DoubleSide });
    const grid = document.getElementById('grid');
    for (const preset of list) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      grid.append(cell);
      const t0 = performance.now();
      const { buf } = runGraph(toCompiled(preset), { maxFaces: 3e6 });
      const ms = performance.now() - t0;
      const label = document.createElement('span');
      label.textContent = `${preset.name} · ${buf.nFaces.toLocaleString()} faces · ${ms.toFixed(0)} ms`;
      cell.append(label);

      const r = toRenderBuffers(buf, false);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(r.position, 3));
      g.setIndex(new THREE.BufferAttribute(r.index, 1));
      g.computeBoundingSphere();
      const scene = new THREE.Scene();
      scene.add(new THREE.Mesh(g, material));
      scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.3));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(3, -2, 5);
      scene.add(sun);
      const { center, radius } = g.boundingSphere;
      const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
      camera.up.set(0, 0, 1);
      camera.position.copy(center).add(new THREE.Vector3(1, -1.25, 0.8).normalize().multiplyScalar(radius / Math.sin(Math.PI / 12) * 1.05));
      camera.lookAt(center);

      const rect = cell.getBoundingClientRect();
      const y = innerHeight - rect.bottom;
      renderer.setViewport(rect.left, y, rect.width, rect.height);
      renderer.setScissor(rect.left, y, rect.width, rect.height);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
