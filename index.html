<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>squishables</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
  <script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <h1>squishables</h1>
    <select id="preset"><option value="">Examples…</option></select>
    <button id="new-doc">New</button>
    <button id="load-json">Open</button>
    <button id="save-json">Save</button>
    <span class="sep"></span>
    <label>seed <input id="seed" type="number" class="num" step="1" value="1"></label>
    <button id="reseed" title="Random seed">↻</button>
    <span class="sep"></span>
    <label>color
      <select id="color">
        <option value="normal" selected>normals</option>
        <option value="tag">by tag</option>
        <option value="clay">clay</option>
      </select>
    </label>
    <label><input id="edges" type="checkbox" checked> edges</label>
    <label>limit
      <select id="limit">
        <option value="500000">500k</option>
        <option value="2000000" selected>2M</option>
        <option value="5000000">5M</option>
        <option value="10000000">10M</option>
      </select>
    </label>
    <span class="grow"></span>
    <button id="export-stl">Export STL</button>
    <button id="export-obj">Export OBJ</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>

  <div id="graph">
    <canvas id="graph-canvas"></canvas>
    <div id="graph-hint">Double-click to add a node · drag between slots to wire · right-click for menu · selected node's output shows green</div>
  </div>
  <div id="splitter"></div>

  <main id="viewport">
    <div id="hud">
      <div id="status">loading…</div>
      <div id="warning"></div>
      <button id="stop" hidden>Stop</button>
    </div>
    <button id="frame" title="Frame mesh (F)">Frame</button>
        <div id="legend"></div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
