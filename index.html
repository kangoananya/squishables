<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>squishables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
  <link rel="stylesheet" href="src/style.css">
  <script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <h1>squishables</h1>
    <select id="preset" title="examples"><option value="">/examples/</option></select>
    <span class="group">
      <button id="new-doc">/new/</button>
      <button id="load-json">/open/</button>
      <button id="save-json">/save/</button>
    </span>
    <label>seed <input id="seed" type="number" class="num" step="1" value="1"> <button id="reseed" title="random seed">/↻/</button></label>
    <label>color
      <select id="color">
        <option value="normal" selected>normals</option>
        <option value="tag">by tag</option>
        <option value="clay">clay</option>
      </select>
    </label>
    <label>limit
      <select id="limit">
        <option value="500000">500k</option>
        <option value="2000000">2M</option>
        <option value="5000000" selected>5M</option>
        <option value="10000000">10M</option>
        <option value="Infinity">none</option>
      </select>
    </label>
    <span class="grow"></span>
    <span class="group">
      <button id="export-stl">/export stl/</button>
      <button id="export-obj">/export obj/</button>
    </span>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>

  <div id="graph">
    <canvas id="graph-canvas"></canvas>
    <div id="graph-hint">double-click: add node · drag between slots: wire · right-click: menu · selected node: pink outline</div>
  </div>
  <div id="splitter"></div>

  <main id="viewport">
    <div id="hud">
      <div id="status">loading…</div>
      <div id="warning"></div>
      <button id="stop" hidden>/stop/</button>
    </div>
    <button id="frame" title="frame mesh (F)">/frame/</button>
    <div id="legend"></div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
